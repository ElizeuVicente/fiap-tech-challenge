name: CI/CD

on:
  push:
    branches:
      - homolog
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: ./mvnw verify

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/oficina-tech-challenge" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy-homolog:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/homolog'
    environment: homolog
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/oficina-tech-challenge" >> "$GITHUB_ENV"

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "KUBE_CONFIG secret is not configured; skipping deploy."
            echo "skip_deploy=true" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"

      - name: Update image
        if: env.skip_deploy != 'true'
        run: |
          sed -i "s|oficina-tech-challenge:latest|${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/40-deployment.yaml

      - name: Apply manifests
        if: env.skip_deploy != 'true'
        run: kubectl apply -f k8s/

      - name: Wait for rollout
        if: env.skip_deploy != 'true'
        run: kubectl rollout status deployment/oficina-api -n oficina --timeout=180s

  deploy-prod:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: prod
    steps:
      - name: Production deployment guardrail
        run: |
          echo "Configure KUBE_CONFIG and protection rules in the GitHub 'prod' environment before enabling a production deployment."
          echo "This repository deliberately does not provision or deploy paid cloud resources."
